[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "armadabench-mcp"
version = "0.1.0"
description = "MCP server for ArmadaBench - Star Wars Armada LLM benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ArmadaBench Team" }
]
keywords = ["mcp", "benchmark", "llm", "star-wars-armada", "vassal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
armadabench-mcp = "armadabench_mcp.server:main"
armadabench-run = "armadabench_mcp.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/armadabench_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
