name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Python MCP Server Tests
  python-tests:
    name: Python Tests (MCP Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting (ruff)
        run: |
          ruff check src/ tests/
        continue-on-error: true

      - name: Run type checking (mypy)
        run: |
          mypy src/
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=armadabench_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./mcp-server/coverage.xml
          flags: python
          name: python-coverage
        continue-on-error: true

  # Java Vassal Integration Tests
  java-tests:
    name: Java Tests (Vassal Integration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Vassal Integration Tests
        working-directory: vassal-integration
        run: mvn test -B
        continue-on-error: true  # May fail without VASSAL runtime

      - name: Run Vassal Extension Tests
        working-directory: vassal-extension
        run: mvn test -B
        continue-on-error: true  # May fail without VASSAL runtime

  # React Companion App Tests
  companion-tests:
    name: React Tests (Companion)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm run test:run

  # React Benchmark Site Tests
  benchmark-site-tests:
    name: React Tests (Benchmark Site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark-site

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: benchmark-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm run test:run

  # Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [python-tests, companion-tests, benchmark-site-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Companion
        working-directory: companion
        run: |
          npm ci
          npm run build

      - name: Build Benchmark Site
        working-directory: benchmark-site
        run: |
          npm ci
          npm run build

      - name: Build MCP Server
        working-directory: mcp-server
        run: |
          pip install build
          python -m build
